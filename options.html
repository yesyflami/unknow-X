<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>unknow-X 设置</title>
<style>
  body { font: 15px system-ui, -apple-system, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color: #17202a; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  h1 { font-size: 24px; }
  p { line-height: 1.55; color: #536471; }
  label { display: block; margin: 20px 0 6px; font-weight: 600; }
  input { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #cfd9de; border-radius: 8px; font-size: 15px; }
  button { margin-top: 24px; padding: 10px 18px; border: 0; border-radius: 999px; background: #1d9bf0; color: white; font-weight: 700; cursor: pointer; }
  #language { margin-top: 0; padding: 7px 12px; background: #eef3f4; color: #17202a; }
  #status { margin-left: 10px; color: #00a67d; }
</style>
</head>
<body>
  <header><h1 data-i18n="title">unknow-X 设置</h1><button id="language" type="button">English</button></header>
  <p data-i18n="intro">设置后，X 左下角只会显示这里填写的自定义内容。留空即可隐藏对应文字；头像和账号切换功能会保留。</p>
  <label for="name" data-i18n="nameLabel">自定义昵称</label>
  <input id="name" type="text" maxlength="40" placeholder="例如：工作账号">
  <label for="id" data-i18n="idLabel">自定义 ID</label>
  <input id="id" type="text" maxlength="40" placeholder="例如：@company">
  <button id="save" data-i18n="save">保存设置</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
